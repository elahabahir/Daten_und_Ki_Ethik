Steven ist ein internationaler Student und studiert Informatik an der Technischen Universität Dortmund. Obwohl er die deutsche Sprache gut beherrscht, fällt es ihm manchmal schwer, wissenschaftliche Texte fehlerfrei zu formulieren. Im Rahmen eines Moduls soll er ein Programmierprojekt zum Thema KI-Coding entwickeln und anschließend eine Hausarbeit über seine Vorgehensweise schreiben. Die Nutzung von KI ist dabei ausdrücklich erlaubt, solange sie dokumentiert wird und die wesentlichen Leistungen eigenständig erbracht werden.\\
\newline
Steven arbeitet mehrere Wochen an seinem Projekt. Für die Programmierung verwendet er gelegentlich einen KI-Assistenten, dessen Einsatz er wie vorgeschrieben in einer Tabelle dokumentiert. Beim Verfassen seines Berichts nutzt er zusätzlich ein Online-Rechtschreibtool, welches seine Grammatik verbessert und einige Formulierungen sprachlich überarbeitet. Die Inhalte und Argumentationen stammen jedoch von ihm selbst. Da er das Rechtschreibtool lediglich als sprachliche Unterstützung betrachtet, führt er es nicht in der Tabelle auf.\\
\newline
Nach der Abgabe kontrolliert die wissenschaftliche Mitarbeiterin Laura die eingereichten Hausarbeiten. Um mögliche Täuschungsversuche aufzudecken und eine faire Bewertung aller Studierenden sicherzustellen, verwendet sie einen KI-Checker, Dieser soll erkennen, welche Textpassagen möglicherweise durch künstliche Intelligenz erstellt wurden.\\
\newline
Bei Stevens Hausarbeit schlägt der KI-Checker an: Ein großer Teil seines Berichts wird als wahrscheinlich KI-generiert eingestuft. Laura überfliegt die markierten Textstellen und stellt fest, dass sie sprachlich besonders einheitlich und fehlerfrei formuliert sind. Da sie zahlreiche Arbeiten korrigieren muss und der Verdacht auf eine nicht ausreichend dokumentierte KI-Nutzung besteht, leitet sie den Fall an den zuständigen Prüfungsausschuss weiter.\\
\newline
Wenige Tage später erhält Steven eine E-Mail. Ihm wird mitgeteilt, dass der Verdacht auf einen Täuschungsversuch besteht und seine Arbeit vorerst nicht bewertet werden kann. Er wird zu einem Gespräch eingeladen, in dem er erklären soll, wie sein Bericht entstanden ist.\\
\newline
Steven ist überrascht und verunsichert. Er erklärt, dass er den gesamten Bericht selbst geschrieben und lediglich ein Rechtschreibtool zur sprachlichen Verbesserung verwendet habe. Besonders ungerecht findet er, dass ausgerechnet seine Bemühungen, sprachliche Fehler zu vermeiden, nun gegen ihn verwendet werden.\\
\newline
Laura erklärt, dass es ihre Verpflichtung ist, mögliche Täuschungsversuche zu überprüfen. Würde sie Auffälligkeiten ignorieren, könnten Studierende, die ihre Arbeiten eigenständig verfassen, gegenüber anderen benachteiligt werden. Gleichzeitig betont sie jedoch, dass das Ergebnis des KI-Checkers allein keinen Täuschungsversuch beweist.\\
\newline
Im anschließenden Gespräch mit einem Mitglied des Prüfungsausschusses erfährt Steven, dass solche Erkennungsprogramme fehleranfällig sein können. Insbesondere sprachlich überarbeitete oder übersetzte Texte können unter bestimmten Umständen fälschlicherweise als KI-generiert eingestuft werden. Steven fragt sich deshalb, ob Studierende, die nicht in ihrer Muttersprache schreiben, durch den Einsatz solcher Programme möglicherweise häufiger unter Verdacht geraten.\\
\newline
Der Prüfungsausschuss steht nun vor einer schwierigen Entscheidung. Einerseits möchte die Universität sicherstellen, dass alle Studierenden nach denselben Regeln bewertet werden und unerlaubte KI-Nutzung erkannt wird. Andererseits darf niemand allein aufgrund einer möglicherweise fehlerhaften Softwarebewertung zu Unrecht beschuldigt werden.\\
Steven bietet an, seine Entwürfe und den Bearbeitungsverlauf seines Dokuments vorzulegen. Allerdings besitzt er nicht mehr alle Zwischenversionen. Er fragt sich, warum er nun seine Eigenständigkeit nachweisen soll, obwohl der ursprüngliche Verdacht hauptsächlich auf einer automatisierten Einschätzung beruht.\\
\newline
Eine endgültige Entscheidung über seine Arbeit steht noch aus. Während Steven auf das Ergebnis wartet, überlegt die Fakultät, ob sie KI-Checker weiterhin zur Überprüfung studentischer Arbeiten einsetzen sollte und unter welchen Bedingungen dies vertretbar wäre.\\





