\section{Prozess-Notiz}

Ein erster Vorschlag hatte KI-Chatbots betrachtet und ob man an diese Anforderungen ähnlich wie den Beobachtungsstudien stellen sollte. Im Gewissensbit wäre es darum gegangen das diese KI-Agenten auf allen Gesprächen trainiert werden und, zumindest in früheren Versionen, recht passive unterstützende 'Gesprächspartner' waren. Im konkreten Konflikt ging es darum gegangen, dass zwar präventiv bestimmte Themen und Inhalte vom Betreiber geblockt waren, aber dennoch aktiv an ähnlichen profitiert wird, wie dem Verhalten einiger Nutzer die solche Agenten nutzen um echte 'Partner' zu ersetzen.\\
Bei dem Vorschlag ist es daran gescheitert, dass wir in der Gruppe dem Thema nicht nahe waren, bzw. KI-Agenten so nicht aktiv nutzen und auch keine eigenen Beispiele solchen Nutzens kannten. Das Thema war nur aus Meldungen von Zeitschriften bekannt.\\
Am Ende haben wir uns dafür entschieden im Gewissensbit das Thema von KI-Checkern zu betrachten. Aus dem Ansatz der erhöhten Anschlagquote dieser für fremdsprachige Studenten haben wir dann als Beispiel die Nutzung von Rechtschreibtools oder maschinellen Übersetzungen konkretisiert und inwiefern man Checker dann als verlässlich anzunehmen sollte.\\

